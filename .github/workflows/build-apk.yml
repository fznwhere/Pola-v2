name: Build Pola APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v5

      - name: Siapkan Folder Web (www)
        run: |
          mkdir -p www
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'www' -exec cp -r {} www/ \;

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Buat Project Android dengan Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications
          npx cap init "Pola" "com.pola.tracker.v2" --web-dir=www
          npx cap add android

      - name: Pasang Ikon Aplikasi & Notifikasi Pola
        run: |
          npm install @capacitor/assets --save-dev
          mkdir -p android/app/src/main/res/drawable
          node -e '
            (async () => {
              const fs = require("fs");
              const sharp = require("sharp");
              const bg = { r: 250, g: 247, b: 242, alpha: 1 };
              const transparent = { r: 0, g: 0, b: 0, alpha: 0 };

              const { data, info } = await sharp("assets/icons/logo.png")
                .ensureAlpha()
                .raw()
                .toBuffer({ resolveWithObject: true });

              const colorText = Buffer.from(data);
              const whiteSilhouette = Buffer.from(data);

              for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
                const isBgCream = r > 220 && g > 220 && b > 210;
                if (a < 50 || isBgCream) {
                  colorText[i + 3] = 0;
                  whiteSilhouette[i] = 0; whiteSilhouette[i + 1] = 0; whiteSilhouette[i + 2] = 0; whiteSilhouette[i + 3] = 0;
                } else {
                  whiteSilhouette[i] = 255; whiteSilhouette[i + 1] = 255; whiteSilhouette[i + 2] = 255; whiteSilhouette[i + 3] = 255;
                }
              }

              const croppedText = await sharp(colorText, { raw: { width: info.width, height: info.height, channels: 4 } })
                .trim()
                .png()
                .toBuffer();

              // 1. Ikon Launcher HP & Kartu Notifikasi (Diperbesar ke 840px)
              await sharp(croppedText)
                .resize(840, 840, { fit: "contain", background: transparent })
                .extend({ top: 92, bottom: 92, left: 92, right: 92, background: transparent })
                .png()
                .toFile("assets/icon-foreground.png");

              await sharp({
                create: { width: 1024, height: 1024, channels: 4, background: bg }
              })
                .png()
                .toFile("assets/icon-background.png");

              await sharp(croppedText)
                .resize(880, 880, { fit: "contain", background: bg })
                .extend({ top: 72, bottom: 72, left: 72, right: 72, background: bg })
                .png()
                .toFile("assets/icon-only.png");

              // 2. Ikon Kecil Status Bar Notifikasi (Maksimal 92px)
              if (fs.existsSync("assets/icons/ic_stat_pola.png")) {
                fs.copyFileSync("assets/icons/ic_stat_pola.png", "android/app/src/main/res/drawable/ic_stat_pola.png");
              } else {
                await sharp(whiteSilhouette, { raw: { width: info.width, height: info.height, channels: 4 } })
                  .trim()
                  .resize(92, 92, { fit: "contain", background: transparent })
                  .extend({ top: 2, bottom: 2, left: 2, right: 2, background: transparent })
                  .png()
                  .toFile("android/app/src/main/res/drawable/ic_stat_pola.png");
              }

              const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
              cfg.plugins = cfg.plugins || {};
              cfg.plugins.LocalNotifications = {
                smallIcon: "ic_stat_pola",
                iconColor: "#C85A32"
              };
              fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
            })();
          '
          npx capacitor-assets generate --android
          
      - name: Pasang Suara Notifikasi Custom
        run: |
          mkdir -p android/app/src/main/res/raw
          if [ -d "assets/sounds" ]; then
            find assets/sounds -type f \( -iname "*.mp3" -o -iname "*.wav" -o -iname "*.ogg" \) -exec cp {} android/app/src/main/res/raw/ \;
          fi

      - name: Tambahkan Izin Alarm & Notifikasi Android
        run: |
          node -e '
            const fs = require("fs");
            const path = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(path, "utf8");
            const perms = `    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n`;
            xml = xml.replace("<application", perms + "    <application");
            fs.writeFileSync(path, xml);
          '

      - name: Sinkronisasi & Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload File APK
        uses: actions/upload-artifact@v5
        with:
          name: Pola-v2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk