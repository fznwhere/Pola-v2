<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pola.</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/icons/logo.png">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- ANIMASI INTRO -->
    <div id="intro-screen">
        <video id="intro-video" src="assets/media/intro.mp4" autoplay muted playsinline></video>
    </div>

    <!-- EFEK BLUR PROGRESIF SAAT GESER -->
    <div class="drawer-blur-backdrop" id="drawer-blur-backdrop"></div>

    <!-- PANEL GESER KIRI FULL-SCREEN (BERANDA) -->
    <aside class="side-drawer" id="side-drawer" aria-hidden="true">
        <div class="drawer-header">
            <h2 class="brand-title">Pola<span class="brand-dot">.</span></h2>
            <p class="drawer-subtitle" id="drawer-section-label">Rutinitas</p>
        </div>

        <div class="drawer-top-selector">
            <span class="drawer-menu-heading">Data</span>
            <div class="drawer-options-row">
                <button class="drawer-option-pill active" id="dopt-rutinitas" onclick="switchDrawerTab('Rutinitas')">
                    <span>Rutinitas</span>
                    <small id="dcount-rutinitas">0</small>
                </button>
                <button class="drawer-option-pill" id="dopt-acara" onclick="switchDrawerTab('Acara')">
                    <span>Acara</span>
                    <small id="dcount-acara">0</small>
                </button>
                <button class="drawer-option-pill" id="dopt-libur" onclick="switchDrawerTab('Libur')">
                    <span>Hari Libur</span>
                    <small id="dcount-libur">0</small>
                </button>
            </div>
        </div>

        <div class="drawer-scroll-area" id="drawer-scroll-area">
            <div id="drawer-content-list"></div>
        </div>
    </aside>

    <div class="app-container">
        <!-- HALAMAN 1: BERANDA -->
        <section id="page-beranda" class="page-view">
            <header>
                <h1 class="brand-title">Pola<span class="brand-dot">.</span></h1>
                <p>Hari Ini</p>
            </header>
            <div id="schedule-list"></div>
        </section>

        <!-- HALAMAN 2: KALENDER -->
        <section id="page-kalender" class="page-view" style="display: none;">
            <div class="calendar-header">
                <button class="btn-prev" onclick="changeMonth(-1)">❮</button>
                <div style="position: relative; cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; width: 100%;">
                    <h1 class="brand-title" style="margin-bottom: 2px;">Pola<span class="brand-dot">.</span></h1>
                    <p id="month-display-text" style="color: var(--text-muted); font-size: 14px; font-weight: 500;"></p>
                    <input type="month" id="native-month-picker" style="position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor: pointer;">
                </div>
                <button class="btn-next" onclick="changeMonth(1)">❯</button>
            </div>

            <div class="calendar-grid" id="calendar-grid"></div>

            <div class="upcoming-container">
                <h2 class="section-title">Tugas Belum Selesai</h2>
                <div id="upcoming-list"></div>
            </div>

            <div class="history-container">
                <h2 class="section-title">Riwayat & Terlewat</h2>
                <div class="history-tabs">
                    <button class="tab-btn active" id="tab-tk" onclick="renderHistory('Tugas Kuliah')">Tugas Kuliah</button>
                    <button class="tab-btn" id="tab-tb" onclick="renderHistory('Tugas')">Tugas</button>
                    <button class="tab-btn" id="tab-terlewat" onclick="renderHistory('Terlewat')">Tugas Terlewat</button>
                </div>
                <div id="history-list"></div>
            </div>
        </section>

        <!-- HALAMAN 3: KULIAH -->
        <section id="page-matkul" class="page-view" style="display: none;">
            <header>
                <h1 class="brand-title">Pola<span class="brand-dot">.</span></h1>
                <p id="active-semester-subtitle">Semester Ini</p>
            </header>
            <div id="matkul-list"></div>
        </section>

        <!-- FAB DINAMIS UNTUK SEMUA HALAMAN -->
        <div class="fab-backdrop" id="fab-backdrop" onclick="closeFabMenu()"></div>
        <div class="fab-container">
            <div class="fab-menu" id="fab-menu"></div>
            <div class="fab" onclick="handleMainFabClick()"></div>
        </div>
    </div>

    <!-- MODAL DETAIL TANGGAL KALENDER -->
    <div class="modal-overlay" id="day-detail-modal">
        <div class="modal">
            <h2 id="detail-date-title" style="font-size: 16px; margin-bottom: 15px;">Jadwal</h2>
            <div id="detail-list" style="margin-bottom: 20px; max-height: 50vh; overflow-y: auto;"></div>
            <div class="modal-btns"><button onclick="closeModal('day-detail-modal')" class="btn-save">Tutup</button></div>
        </div>
    </div>

    <!-- MODAL PINDAH JADWAL KULIAH -->
    <div class="modal-overlay" id="reschedule-modal">
        <div class="modal">
            <h2 style="font-size: 16px;">Ubah Jadwal Ini</h2>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">(Hanya mengubah hari ini, minggu depan tetap normal)</p>
            <input type="hidden" id="res-matkulId">
            <input type="hidden" id="res-originalDate">
            <label>Pindah ke Tanggal</label><input type="date" id="res-date">
            <label>Ubah Jam</label><input type="time" id="res-time">
            <label>Ubah Jam Selesai</label><input type="time" id="res-time-end">
            <label>Ubah Ruangan / Via</label><input type="text" id="res-ruang">
            <label>Dosen Pengganti</label><input type="text" id="res-dosen">
            <div class="modal-btns">
                <button onclick="closeModal('reschedule-modal')" class="btn-cancel">Batal</button>
                <button class="btn-save" onclick="saveReschedule()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODAL DATA MATA KULIAH -->
    <div class="modal-overlay" id="matkul-modal">
        <div class="modal">
            <h2>Data Kuliah</h2>
            <form id="matkul-form">
                <label>Nama Kuliah *</label><input type="text" id="m-name">
                <label>Hari *</label>
                <select id="m-hari">
                    <option value="Senin">Senin</option><option value="Selasa">Selasa</option>
                    <option value="Rabu">Rabu</option><option value="Kamis">Kamis</option>
                    <option value="Jumat">Jumat</option><option value="Sabtu">Sabtu</option>
                </select>
                <div style="display: flex; gap: 10px;">
                    <div style="width: 50%;"><label>Jam Mulai *</label><input type="time" id="m-jamMulai"></div>
                    <div style="width: 50%;"><label>Jam Selesai</label><input type="time" id="m-jamSelesai"></div>
                </div>
                <label>Dosen Pengampu</label><input type="text" id="m-dosen">
                <label>Ruangan</label><input type="text" id="m-ruangan">
            </form>
            <div class="modal-btns">
                <button onclick="closeModal('matkul-modal')" class="btn-cancel">Batal</button>
                <button class="btn-save" onclick="saveMatkul()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODAL INSERT UTAMA -->
    <div class="modal-overlay" id="insert-modal">
        <div class="modal">
            <h2 id="modal-title">Tambah</h2>
            <form id="insert-form">
                <input type="hidden" id="current-category">
                
                <div id="field-nama-kegiatan"><label>Nama Kegiatan *</label><input type="text" id="new-task-name"></div>
                
                <div id="field-matkul-dropdown" style="display:none;">
                    <label>Mata Kuliah *</label><select id="task-matkul-select"></select>
                </div>
                
                <div id="field-pengumpulan" style="display:none;"><label>Pengumpulan</label><input type="text" id="task-via"></div>
                <div id="field-ruangan" style="display:none;"><label>Ruangan</label><input type="text" id="new-task-ruang"></div>

                <div id="field-rutinitas-hari" style="display: none;">
                    <label>Pilih Hari Rutinitas *</label>
                    <div class="checkbox-group">
                        <label class="check-all-label"><input type="checkbox" id="routine-days-all">Semua</label>
                        <label><input type="checkbox" name="routine-days" value="Senin">Sen</label>
                        <label><input type="checkbox" name="routine-days" value="Selasa">Sel</label>
                        <label><input type="checkbox" name="routine-days" value="Rabu">Rab</label>
                        <label><input type="checkbox" name="routine-days" value="Kamis">Kam</label>
                        <label><input type="checkbox" name="routine-days" value="Jumat">Jum</label>
                        <label><input type="checkbox" name="routine-days" value="Sabtu">Sab</label>
                        <label><input type="checkbox" name="routine-days" value="Minggu">Min</label>
                    </div>
                </div>

                <div id="field-tanggal"><label>Tanggal Mulai *</label><input type="date" id="new-task-date"></div>
                <div id="field-tanggal-selesai" style="display: none;"><label>Tanggal Selesai (Opsional)</label><input type="date" id="new-task-date-end"></div>
                
                <div style="display: flex; gap: 10px;">
                    <div id="field-jam" style="width: 100%;"><label>Jam Mulai *</label><input type="time" id="new-task-time"></div>
                    <div id="field-jam-selesai" style="display:none; width: 100%;"><label>Jam Selesai</label><input type="time" id="new-task-time-end"></div>
                </div>

                <div id="field-reminder">
                    <label>Pengingat Tambahan (Opsional)</label>
                    <div class="reminder-row">
                        <input type="number" id="custom-remind-val" min="1" placeholder="Contoh: 30">
                        <select id="custom-remind-unit">
                            <option value="minutes">Menit sebelum</option>
                            <option value="hours">Jam sebelum</option>
                        </select>
                    </div>
                    <small class="field-hint">Alarm 5 menit sebelum & tepat waktu tetap aktif otomatis.</small>
                </div>
                
                <div id="field-desc"><label>Deskripsi (Opsional)</label><textarea id="new-task-desc" rows="2"></textarea></div>
                
                <div id="field-warna" style="display: none;">
                    <label>Warna Penanda</label>
                    <div class="color-swatches" id="color-swatches-container">
                        <div class="swatch" data-color="#4A7C59" style="background-color: #4A7C59;"></div>
                        <div class="swatch" data-color="#364958" style="background-color: #364958;"></div>
                        <div class="swatch" data-color="#A36B69" style="background-color: #A36B69;"></div>
                        <div class="swatch" data-color="#795C48" style="background-color: #795C48;"></div>
                        <div class="swatch" data-color="#3E5A47" style="background-color: #3E5A47;"></div>
                        <div class="swatch" data-color="#723D46" style="background-color: #723D46;"></div>
                        <div class="swatch" data-color="#5A4A6F" style="background-color: #5A4A6F;"></div>
                        <div class="swatch" data-color="#5F7485" style="background-color: #5F7485;"></div>
                        <div class="swatch" data-color="#AD6A51" style="background-color: #AD6A51;"></div>
                        <div class="swatch" data-color="#8C6239" style="background-color: #8C6239;"></div>
                    </div>
                    <input type="hidden" id="new-task-color" value="#4A7C59">
                </div>
            </form>
            <div class="modal-btns">
                <button onclick="closeModal('insert-modal')" class="btn-cancel">Batal</button>
                <button class="btn-save" onclick="saveNewTask()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- NAVIGASI BAWAH INSTAN -->
    <nav class="bottom-nav">
        <a href="#beranda" class="nav-item active" id="nav-beranda" onclick="event.preventDefault(); switchMainPage('beranda');"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></a>
        <a href="#kalender" class="nav-item" id="nav-kalender" onclick="event.preventDefault(); switchMainPage('kalender');"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></a>
        <a href="#matkul" class="nav-item" id="nav-matkul" onclick="event.preventDefault(); switchMainPage('matkul');"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></a>
    </nav>
    <script src="script.js"></script>
    <script src="notif.js"></script>
</body>
</html>
