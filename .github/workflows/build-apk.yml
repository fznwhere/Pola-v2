name: Build Pola APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v5

      - name: Siapkan Folder Web (www)
        run: |
          mkdir -p www
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'www' -exec cp -r {} www/ \;

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Buat Project Android dengan Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications
          npx cap init "Pola" "com.pola.tracker.v2" --web-dir=www
          npx cap add android

      - name: Pasang Ikon Aplikasi Pola
        run: |
          npm install @capacitor/assets --save-dev
          node -e '
            (async () => {
              const sharp = require("sharp");
              const bg = { r: 250, g: 247, b: 242, alpha: 1 };
              const transparent = { r: 0, g: 0, b: 0, alpha: 0 };

              await sharp("assets/icons/logo.png")
                .resize(640, 640, { fit: "contain", background: transparent })
                .extend({ top: 192, bottom: 192, left: 192, right: 192, background: transparent })
                .png()
                .toFile("assets/icon-foreground.png");

              await sharp({
                create: { width: 1024, height: 1024, channels: 4, background: bg }
              })
                .png()
                .toFile("assets/icon-background.png");

              await sharp("assets/icons/logo.png")
                .resize(820, 820, { fit: "contain", background: bg })
                .extend({ top: 102, bottom: 102, left: 102, right: 102, background: bg })
                .png()
                .toFile("assets/icon-only.png");
            })();
          '
          npx capacitor-assets generate --android

      - name: Tambahkan Izin Alarm & Notifikasi Android
        run: |
          node -e '
            const fs = require("fs");
            const path = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(path, "utf8");
            const perms = `    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n`;
            xml = xml.replace("<application", perms + "    <application");
            fs.writeFileSync(path, xml);
          '

      - name: Sinkronisasi & Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload File APK
        uses: actions/upload-artifact@v5
        with:
          name: Pola-v2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk